name: Deploy to VM

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-vm
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Validate deploy secrets
        run: |
          missing=0
          if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "::error::Missing repository secret SSH_PRIVATE_KEY (private key PEM, including BEGIN/END lines)"
            missing=1
          fi
          if [ -z "${{ secrets.VM_HOST }}" ]; then
            echo "::error::Missing repository secret VM_HOST (VM IP or hostname)"
            missing=1
          fi
          if [ -z "${{ secrets.VM_USER }}" ]; then
            echo "::error::Missing repository secret VM_USER (SSH user, e.g. deploy)"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo ""
            echo "Add secrets: GitHub repo → Settings → Secrets and variables → Actions → New repository secret"
            echo "See docs/deploy-vm.md → GitHub Actions (automated deploy)"
            exit 1
          fi

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 25m
          script: |
            set -euo pipefail

            APP_PATH="${{ secrets.VM_APP_PATH }}"
            BRANCH="${{ secrets.VM_BRANCH }}"

            if [ -z "$APP_PATH" ]; then APP_PATH="/var/www/Fleet-Manager"; fi
            if [ -z "$BRANCH" ]; then BRANCH="main"; fi

            echo "==> Deploying branch: $BRANCH"
            echo "==> App path: $APP_PATH"

            cd "$APP_PATH"

            if [ ! -d .git ]; then
              echo "ERROR: $APP_PATH is not a git repository"
              exit 1
            fi

            # Avoid writing ~/.gitconfig (may be root-owned). Pass safe.directory per command.
            git_cmd() {
              git -c safe.directory="$APP_PATH" "$@"
            }

            # git fetch needs write access to .git/ (FETCH_HEAD, etc.)
            if [[ ! -w .git ]]; then
              echo "==> Fixing repository ownership for $(whoami)"
              if command -v sudo >/dev/null 2>&1 && sudo -n chown -R "$(whoami):$(whoami)" "$APP_PATH"; then
                echo "==> Ownership updated"
              else
                echo "ERROR: cannot write to .git — permission denied."
                echo "On the VM run: sudo chown -R $(whoami):$(whoami) $APP_PATH"
                echo "Or: sudo DEPLOY_USER=$(whoami) APP_PATH=$APP_PATH bash deploy/scripts/setup-ci-deploy.sh"
                exit 1
              fi
            fi

            if [ ! -f backend/.env ]; then
              echo "ERROR: missing backend/.env on server"
              exit 1
            fi

            if [ ! -f frontend/.env.production ]; then
              echo "ERROR: missing frontend/.env.production on server"
              exit 1
            fi

            # git fetch uses SSH to github.com — needs known_hosts (non-interactive CI cannot type "yes").
            mkdir -p ~/.ssh
            chmod 700 ~/.ssh
            if ! grep -q '^github.com' ~/.ssh/known_hosts 2>/dev/null; then
              echo "==> Adding github.com to ~/.ssh/known_hosts"
              ssh-keyscan -t rsa,ecdsa,ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
            fi
            chmod 600 ~/.ssh/known_hosts 2>/dev/null || true

            git_cmd fetch origin "$BRANCH"
            git_cmd checkout "$BRANCH"
            git_cmd reset --hard "origin/$BRANCH"

            bash deploy/scripts/deploy.sh

            echo "==> Health check"
            ok=0
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:4100/api/health >/dev/null; then
                ok=1
                break
              fi
              echo "Waiting for API on :4100... attempt ${i}/30"
              sleep 2
            done
            if [ "$ok" -ne 1 ]; then
              echo "::error::API did not respond on http://127.0.0.1:4100/api/health"
              echo "Check: sudo journalctl -u fleet-api -n 50 --no-pager"
              exit 1
            fi
            curl -fsS http://127.0.0.1:4100/api/health
            echo ""
            echo "Deploy OK"
