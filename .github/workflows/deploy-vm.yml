name: Deploy to VM

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-vm
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 25m
          script: |
            set -euo pipefail

            APP_PATH="${{ secrets.VM_APP_PATH }}"
            BRANCH="${{ secrets.VM_BRANCH }}"

            if [ -z "$APP_PATH" ]; then APP_PATH="/var/www/Fleet-Manager"; fi
            if [ -z "$BRANCH" ]; then BRANCH="main"; fi

            echo "==> Deploying branch: $BRANCH"
            echo "==> App path: $APP_PATH"

            cd "$APP_PATH"

            if [ ! -d .git ]; then
              echo "ERROR: $APP_PATH is not a git repository"
              exit 1
            fi

            # Git refuses to run when repo dir is owned by another user (e.g. root clone).
            git config --global --add safe.directory "$APP_PATH"

            # git fetch needs write access to .git/ (FETCH_HEAD, etc.)
            if [[ ! -w .git ]]; then
              echo "==> Fixing repository ownership for $(whoami)"
              if command -v sudo >/dev/null 2>&1 && sudo -n chown -R "$(whoami):$(whoami)" "$APP_PATH"; then
                echo "==> Ownership updated"
              else
                echo "ERROR: cannot write to .git — permission denied."
                echo "On the VM run: sudo chown -R $(whoami):$(whoami) $APP_PATH"
                echo "Or: sudo DEPLOY_USER=$(whoami) APP_PATH=$APP_PATH bash deploy/scripts/setup-ci-deploy.sh"
                exit 1
              fi
            fi

            if [ ! -f backend/.env ]; then
              echo "ERROR: missing backend/.env on server"
              exit 1
            fi

            if [ ! -f frontend/.env.production ]; then
              echo "ERROR: missing frontend/.env.production on server"
              exit 1
            fi

            git fetch origin "$BRANCH"
            git checkout "$BRANCH"
            git reset --hard "origin/$BRANCH"

            bash deploy/scripts/deploy.sh

            echo "==> Health check"
            curl -fsS http://127.0.0.1:4100/api/health
            echo ""
            echo "Deploy OK"
