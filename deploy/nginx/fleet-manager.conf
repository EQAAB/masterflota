# Fleet Manager — Nginx site config
# Install:
#   sudo cp deploy/nginx/fleet-manager.conf /etc/nginx/sites-available/fleet-manager
#   sudo ln -sf /etc/nginx/sites-available/fleet-manager /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Production server (HTTPS terminates at load balancer or add Certbot for 443).

server {
    listen 80;
    server_name 169.58.28.189;

    client_max_body_size 40m;

    # React SPA (Vite base: /fleet)
    location /fleet/ {
        alias /var/www/Fleet-Manager/frontend/dist/;
        try_files $uri $uri/ @fleet_spa;
    }

    location @fleet_spa {
        rewrite ^ /fleet/index.html last;
    }

    location = /fleet {
        return 301 /fleet/;
    }

    location = /fleet/index.html {
        alias /var/www/Fleet-Manager/frontend/dist/index.html;
    }

    # API proxy — strips /fleet-api prefix and forwards to Express /api/*
    location /fleet-api/ {
        proxy_pass http://127.0.0.1:4100/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
