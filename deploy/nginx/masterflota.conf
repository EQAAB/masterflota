# Fleet Manager — Masterflota production (split subdomains)
# Install:
#   sudo bash deploy/scripts/configure-nginx-masterflota.sh
#   sudo certbot --nginx -d app.masterflota.com -d api.masterflota.com
#
# UI:  https://app.masterflota.com/
# API: https://api.masterflota.com/api/health

# --- Frontend (React SPA at domain root) ---
server {
    listen 80;
    server_name app.masterflota.com;

    client_max_body_size 40m;

    root /var/www/Fleet-Manager/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# --- Backend API (Express on :4100, routes under /api/*) ---
server {
    listen 80;
    server_name api.masterflota.com;

    client_max_body_size 40m;

    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
